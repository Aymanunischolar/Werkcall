version: "3.9"

# Free-first local stack (blueprint §4, §11). Supabase, Google, HubSpot and
# Gemini are hosted free-tier services reached over the network — only the
# backend, frontend and n8n orchestrator run locally.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VOICE_PROVIDER=${VOICE_PROVIDER:-mock}
    volumes:
      - ./knowledge-base:/knowledge-base:ro

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/imported-workflows:ro

volumes:
  n8n_data:
